name: Backend tests

on:
  push:
    branches: [main, dev]
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # same as the Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Only the self-contained tests: backend_test.py and
      # test_iteration4_manipulation.py call an old preview URL.
      - run: pytest tests/test_security.py tests/test_units.py tests/test_api.py
